[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pharos"
version = "0.1.0"
description = "A cross-modal archival SETI ranking framework"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Pharos maintainers" },
]
license = "Apache-2.0"
keywords = ["seti", "technosignatures", "astronomy", "archival", "gaia", "wise"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "astropy==8.0.1",
    "astroquery==0.4.11",
    "numpy==2.4.6; python_version < '3.12'",
    "numpy==2.5.1; python_version >= '3.12'",
    "pandas==3.0.5",
    "pyarrow==25.0.0",
    "scikit-learn==1.9.0",
    "scipy==1.17.1; python_version < '3.12'",
    "scipy==1.18.0; python_version >= '3.12'",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "ruff==0.15.12",
    "mypy==2.0.0",
    "pip-audit==2.9.0",
]

[project.urls]
Homepage = "https://pharos-seti.org"
Repository = "https://github.com/geeknik/pharos-seti-data"
Manuscript = "https://pharos-seti.org/manuscript"

[tool.setuptools.packages.find]
where = ["src"]

# Security constraints registered by the frozen v0.1.4 pre-registration
# (pre_registration/v0.1.4_control_population.md Section 5.3): the 2026-11-04
# audit found 17 advisories across these four transitive packages; the exact
# remediation versions are registered there and must not drift in the lock.
# certifi's identity additionally pins the CA bundle (234,072 bytes,
# sha256 d87887200c9a705dccc937b9b83b5e67e47024c4a4b7f9dd15700c72e0f55453).
[tool.uv]
constraint-dependencies = [
    "certifi==2026.10.18",
    "urllib3==2.8.0",
    "filelock==4.2.1",
    "msgpack==1.2.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "astropy",
    "astropy.*",
    "astroquery.*",
    "numpy",
    "numpy.*",
    "pandas",
    "pandas.*",
    "pyarrow",
    "pyarrow.*",
    "yaml",
]
ignore_missing_imports = true
follow_imports = "skip"
